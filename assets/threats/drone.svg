<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="БпЛА / шахед">
  <!-- Nose up = NORTH (0deg). The renderer rotates by the SOURCE heading:
       0 N, 90 E, 180 S, 270 W. Geometry traced 1:1 from the approved
       reference, which draws this airframe pointing left; it is rotated here
       so the nose points up. The reference is distinctly taller than wide
       once rotated — a squat arrowhead, not a tall cone. -->
  <g fill="#F5A623" stroke="#16283C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Rounded nose, the two small notches beside it, flat trailing edge and
         the short tail tab in the middle of it. -->
    <path d="M14.8 3.2A2 2 0 0 1 17.2 3.2L19.4 5.2 17.6 5.8 26 26.6H18.4V29.8H13.6V26.6H6L14.4 5.8 12.6 5.2Z"/>
    <path d="M16 5.4 21.8 24.4H10.2Z" stroke="none" fill="#FFC55C" opacity=".45"/>
  </g>
</svg>
