<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Балістична ракета">
  <!-- Nose up = NORTH. Traced 1:1 from the approved reference: a long,
       slender body with an ogive nose, two fins sweeping down-and-out and a
       short nozzle below. Deliberately reads as a rocket, not as an
       aircraft: no wingspan, no horizontal surface. -->
  <g fill="#E8352C" stroke="#16283C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 1.4 19.9 9.8 19.9 18.6 24 25.6 22.8 28.3 19.6 24 19.9 19 12.1 19 12.4 24 9.2 28.3 8 25.6 12.1 18.6 12.1 9.8Z"/>
    <path d="M14.3 20.4 17.7 20.4 17.7 30.4 14.3 30.4Z"/>
    <path d="M16 5.6 18.4 12.4H13.6Z" stroke="none" fill="#F0685E" opacity=".5"/>
  </g>
</svg>
