<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Крилата ракета">
  <!-- Nose up = NORTH. Traced 1:1 from the approved reference, which shows a
       side view pointing right; rotated here so the nose points up, which
       also turns the two vertical fins into a horizontal wingspan. -->
  <g fill="#E8352C" stroke="#16283C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Slender body, pointed nose, forked tail prongs. -->
    <path d="M16 1.6 19.7 8 19.5 20.6 20.1 24.2 22.8 29.6 19 27.6 16 28.6 13 27.6 9.2 29.6 11.9 24.2 12.5 20.6 12.3 8Z"/>
    <!-- Wingspan. -->
    <path d="M19.6 14.2 29.4 13 29.4 17.9 19.5 19.4Z"/>
    <path d="M12.4 14.2 2.6 13 2.6 17.9 12.5 19.4Z"/>
    <!-- Shading along the lower fuselage, as in the reference. -->
    <path d="M13.4 21 18.6 21 18.9 25.6 16 28.6 13.1 25.6Z" stroke="none" fill="#C4271F" opacity=".55"/>
  </g>
</svg>
