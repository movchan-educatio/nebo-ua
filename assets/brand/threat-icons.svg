<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Dark outline group: every filled silhouette gets a subtle dark halo
       (stroke painted UNDER the fill) so markers stay readable over black
       basemap and over red/orange/yellow alert polygons. Detail strokes
       carry their own explicit stroke and are unaffected. -->
  <!-- ================= SHAHED / GERAN-2 =================
       Loitering munition, top view, nose up (0° = NORTH).
       Wide delta with notched (W) trailing edge, thick fuselage,
       tip winglets, wide rear propeller. NOT a plain triangle. -->
  <symbol id="shahed" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Delta wing with W trailing-edge notch -->
    <path d="M32 4 L60 45 L45 41.5 L32 47.5 L19 41.5 L4 45 Z" fill="currentColor" stroke="none"/>
    <!-- Thick central fuselage overlapping the wing -->
    <path d="M27.5 9 L36.5 9 L36.5 40 Q36.5 44 32 44 Q27.5 44 27.5 40 Z" fill="currentColor" stroke="none" opacity="0.9"/>
    <!-- Nose tip -->
    <path d="M29 9 L32 4 L35 9 Z" fill="currentColor" stroke="none"/>
    <!-- Tip winglets -->
    <path d="M8 43 L5 51 M56 43 L59 51" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- Wide rear propeller + hub -->
    <path d="M21 53 L43 53" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="53" r="2.4" fill="currentColor" stroke="none"/>
  </g></symbol>

  <!-- ================= GENERIC UAV (quadcopter) =================
       Neutral multicopter, top view. Solid rotor discs.
       NEVER used for confirmed Shahed. -->
  <symbol id="uav" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Diagonal arms (X config) -->
    <path d="M32 32 L15 15 M32 32 L49 15 M32 32 L15 49 M32 32 L49 49" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Rotor discs -->
    <circle cx="14" cy="14" r="9" fill="currentColor" stroke="none" opacity="0.82"/>
    <circle cx="50" cy="14" r="9" fill="currentColor" stroke="none" opacity="0.82"/>
    <circle cx="14" cy="50" r="9" fill="currentColor" stroke="none" opacity="0.82"/>
    <circle cx="50" cy="50" r="9" fill="currentColor" stroke="none" opacity="0.82"/>
    <!-- Motor hubs -->
    <circle cx="14" cy="14" r="2.6" fill="currentColor" stroke="none"/>
    <circle cx="50" cy="14" r="2.6" fill="currentColor" stroke="none"/>
    <circle cx="14" cy="50" r="2.6" fill="currentColor" stroke="none"/>
    <circle cx="50" cy="50" r="2.6" fill="currentColor" stroke="none"/>
    <!-- Central body -->
    <circle cx="32" cy="32" r="7" fill="currentColor" stroke="none"/>
  </g></symbol>

  <!-- ================= RECON (fixed-wing UAV) =================
       Wide tapered straight wings, thick fuselage, full tail unit,
       camera gimbal. Visually distinct from Shahed. -->
  <symbol id="recon" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Wide tapered straight wings (bold chord) -->
    <path d="M5 22 L59 22 L56 31 L8 31 Z" fill="currentColor" stroke="none"/>
    <!-- Thick fuselage -->
    <path d="M28.5 5 L35.5 5 L36.5 41 L34 55 L30 55 L27.5 41 Z" fill="currentColor" stroke="none"/>
    <!-- Wingtip pods -->
    <circle cx="8" cy="26.5" r="3" fill="currentColor" stroke="none"/>
    <circle cx="56" cy="26.5" r="3" fill="currentColor" stroke="none"/>
    <!-- Wide tailplane -->
    <path d="M21 44 L43 44 L43 49 L21 49 Z" fill="currentColor" stroke="none"/>
    <!-- Vertical fin -->
    <path d="M30.3 44 L33.7 44 L33.7 58 L30.3 58 Z" fill="currentColor" stroke="none"/>
    <!-- Camera gimbal -->
    <circle cx="32" cy="12" r="3" fill="currentColor" stroke="none" opacity="0.7"/>
  </g></symbol>

  <!-- ================= CRUISE MISSILE =================
       Slender body, sharp nose, broad swept mid-wings, cruciform tail.
       Nose up: heading rotates the whole silhouette. -->
  <symbol id="missile" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Sharp nose + slender body -->
    <path d="M32 3 L36 14 L36 50 L28 50 L28 14 Z" fill="currentColor" stroke="none"/>
    <!-- Broad swept mid-wings -->
    <path d="M28 31 L10 41 L10 45.5 L28 38.5 Z" fill="currentColor" stroke="none"/>
    <path d="M36 31 L54 41 L54 45.5 L36 38.5 Z" fill="currentColor" stroke="none"/>
    <!-- Tail fins -->
    <path d="M28 47 L17 55 L17 58 L28 52.5 Z" fill="currentColor" stroke="none"/>
    <path d="M36 47 L47 55 L47 58 L36 52.5 Z" fill="currentColor" stroke="none"/>
    <!-- Vertical stabilizer -->
    <path d="M30.8 46 L33.2 46 L33.2 60 L30.8 60 Z" fill="currentColor" stroke="none"/>
    <!-- Exhaust -->
    <circle cx="32" cy="51" r="2.4" fill="currentColor" stroke="none" opacity="0.8"/>
  </g></symbol>

  <!-- ================= BALLISTIC MISSILE =================
       Heavy thick body, long conical nose, wide tail fins, nozzle cluster.
       Clearly heavier than the cruise missile. -->
  <symbol id="ballistic" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Thick body -->
    <path d="M26 20 L38 20 L38 47 L26 47 Z" fill="currentColor" stroke="none"/>
    <!-- Long conical nose -->
    <path d="M32 2 L38 20 L26 20 Z" fill="currentColor" stroke="none"/>
    <!-- Wide tail fins -->
    <path d="M26 43 L9 57 L9 60.5 L26 51.5 Z" fill="currentColor" stroke="none"/>
    <path d="M38 43 L55 57 L55 60.5 L38 51.5 Z" fill="currentColor" stroke="none"/>
    <!-- Vertical stabilizers -->
    <path d="M29.8 43 L29.8 60 M34.2 43 L34.2 60" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- Nozzle cluster -->
    <circle cx="28.6" cy="49.5" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="35.4" cy="49.5" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="32" cy="53.5" r="2.2" fill="currentColor" stroke="none"/>
  </g></symbol>

  <!-- ================= KAB (guided aerial bomb) =================
       Fat ogive body, blunt round nose, prominent UMPK wing band,
       cross tail. A bomb, NOT a missile. -->
  <symbol id="kab" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Fat ogive body, blunt nose -->
    <path d="M32 4 C37.5 10.5 40 19 40 28.5 L40 42 L32 53 L24 42 L24 28.5 C24 19 26.5 10.5 32 4 Z" fill="currentColor" stroke="none"/>
    <!-- Prominent UMPK wing band -->
    <path d="M10 25.5 L54 25.5 L54 34 L10 34 Z" fill="currentColor" stroke="none"/>
    <!-- Horizontal tail fins -->
    <path d="M23.5 41 L11 47.5 L11 50.5 L23.5 45.5 Z" fill="currentColor" stroke="none"/>
    <path d="M40.5 41 L53 47.5 L53 50.5 L40.5 45.5 Z" fill="currentColor" stroke="none"/>
    <!-- Vertical tail -->
    <path d="M30.5 40 L33.5 40 L33.5 55.5 L30.5 55.5 Z" fill="currentColor" stroke="none"/>
    <!-- Nose band -->
    <path d="M28 9.5 L36 9.5 L36 12.5 L28 12.5 Z" fill="currentColor" stroke="none" opacity="0.65"/>
  </g></symbol>

  <!-- ================= AVIATION (tactical jet) =================
       Pointed nose, big swept wings, twin canted fins, twin engines. -->
  <symbol id="aircraft" viewBox="0 0 64 64"><g stroke="#050a0f" stroke-opacity="0.8" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">
    <!-- Fuselage + pointed nose -->
    <path d="M32 3 L35.5 15 L35.5 49 L28.5 49 L28.5 15 Z" fill="currentColor" stroke="none"/>
    <!-- Big swept main wings -->
    <path d="M28.5 24 L5 44 L5 48 L28.5 32.5 Z" fill="currentColor" stroke="none"/>
    <path d="M35.5 24 L59 44 L59 48 L35.5 32.5 Z" fill="currentColor" stroke="none"/>
    <!-- Tailplanes -->
    <path d="M28 43 L16 54 L16 56.5 L28 49.5 Z" fill="currentColor" stroke="none"/>
    <path d="M36 43 L48 54 L48 56.5 L36 49.5 Z" fill="currentColor" stroke="none"/>
    <!-- Twin canted vertical fins -->
    <path d="M27 42.5 L22.5 56 L25.5 56.5 L30 43 Z" fill="currentColor" stroke="none"/>
    <path d="M37 42.5 L41.5 56 L38.5 56.5 L34 43 Z" fill="currentColor" stroke="none"/>
    <!-- Twin engine nozzles -->
    <circle cx="29.3" cy="49.5" r="2" fill="currentColor" stroke="none"/>
    <circle cx="34.7" cy="49.5" r="2" fill="currentColor" stroke="none"/>
  </g></symbol>

  <!-- ================= OTHER (unknown contact) =================
       Neutral radar-contact mark: hollow ring + center dot + north tick.
       Not a weapon, not a geometric warning sign. -->
  <symbol id="other" viewBox="0 0 64 64">
    <circle cx="32" cy="35" r="15" fill="none" stroke="currentColor" stroke-width="4.5"/>
    <circle cx="32" cy="35" r="3.6" fill="currentColor" stroke="none"/>
    <path d="M32 9 L32 16" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </symbol>
</svg>
