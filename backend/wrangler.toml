# nebo-ua aggregator (Cloudflare Workers + KV + D1)
# 1) npm i -g wrangler && wrangler login
# 2) wrangler kv:namespace create NEBO_STATE        -> paste id() below
#    wrangler kv:namespace create NEBO_STATE --preview -> paste preview_id() below
#    ВАЖЛИВО: не перейменовуйте binding без оновлення src/index.js —
#    назви в коді й у toml повинні збігатися (це перевіряє backend/test/config.test.js).
# 3) wrangler d1 create nebo-journal                 -> paste database_id below
# 4) wrangler d1 execute nebo-journal --file=./schema.sql
#    (optional) wrangler secret put OFFICIAL_API_TOKEN   # only if you got an official token
# 5) wrangler deploy
name = "check-ua-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Apply migrations/0001_pipeline_state.sql before enabling this writer.
# Uses the existing D1 database; no new paid service or production secret.
SYNC_STATE_STORE = "d1"
# Optional official alerts endpoint (generic JSON, see README). Leave empty to disable.
OFFICIAL_API_URL = ""
NEPTUN_ALERTS_URL = "https://neptun.in.ua/api/v1/alerts"
NEPTUN_THREATS_URL = "https://neptun.in.ua/api/v1/threats"
MAPA_URL = "https://mapa.ua/api/v1/current"
# UkraineAlarm API v3 (official alerts) — RETIRED by owner decision (2026-10-10).
# The provider rejects the key with HTTP 401; support is not being contacted and
# no new key will be issued. While this is "false" the Worker makes ZERO requests
# to api.ukrainealarm.com, writes nothing to D1/KV for it, and the source does not
# appear in the pipeline or in the public source-status block.
# The adapter in src/ukrainealarm.js is kept intact: set this back to "true" and
# the integration comes back without any code change.
OFFICIAL_SOURCE_ENABLED = "false"
# The KEY remains a Worker secret, never a var. Left in place so re-enabling is a
# one-line change and so the secret name stays covered by the leak tests:
#   wrangler secret put UKRAINEALARM_API_KEY
# Optional auth-scheme prefix for the Authorization header, e.g. "Token".
# Default "" sends the raw key (swagger-codegen default); set only if the
# key issuance docs require a prefix.
UKRAINEALARM_API_URL = "https://api.ukrainealarm.com"
UKRAINEALARM_AUTH_SCHEME = ""
# Admin gate for POST /v1/refresh (shared secret, never a var):
#   wrangler secret put REFRESH_TOKEN
# Fail-closed: without the secret the route answers 503; with it,
# calls require `Authorization: Bearer <token>` (wrong => 403).
# How many consecutive successful cycles an alert may be missing before it is closed.
ALERT_MISS_LIMIT = "3"
# Same for monitoring threats (1 miss -> stale, 3 misses -> dropped).
THREAT_MISS_LIMIT = "3"
# Web Push (VAPID). Generate once locally, then:
#   wrangler secret put VAPID_PRIVATE_KEY
# VAPID_SUBJECT must be a mailto: or https: URL identifying the operator.
VAPID_PUBLIC_KEY = "BONfYH0I6KBsYDJ-D9r2D8ltf0x1ValoAgJMGvOnfpAMidm9jUCbfTL-0pOZ2_wHoli7RBgB1h3WVd5dpeVVAx8"
VAPID_SUBJECT = "mailto:kykyyzka@gmail.com"

[triggers]
crons = ["*/1 * * * *"]

[[kv_namespaces]]
binding = "NEBO_STATE"
id = "1222a449b03e4aefae5a2fa5bfe81422"
preview_id = "29297862d2504dc8a4095f3ce646e3a0"

[[d1_databases]]
binding = "nebo_journal"
database_name = "nebo-journal"
database_id = "0ba53007-538d-4b94-bfb1-d458e34b2aaa"
